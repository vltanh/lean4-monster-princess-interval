version: "v0.4"

project:
  name: "The princess and monster game on an interval"
  description: >-
    A Lean 4 formalization of S. Alpern, R. Fokkink, R. Lindelauf and G.-J. Olsder, "The
    'Princess and Monster' game on an interval" (SIAM J. Control Optim. 47, 2008). A searcher
    of speed at most 1 and a hider with continuous paths move in [-1, 1]; the payoff is the
    first meeting time, and mixed strategies are Borel probability measures for the topology
    of uniform convergence on compact sets.


    It proves that the game has a value V and that 15/11 ≤ V ≤ 13/9, together with every
    numbered result of the paper: the dominance results of Section 2, Theorems 9 and 10
    (V ≤ 47/32, V ≥ 97/75), Lemmas 11–13 and Theorems 14 and 15 on searchers with a continuous
    initial distribution, and Theorem 16 on hiders with a continuous initial distribution. The
    minimax theorem of Alpern and Gal and the invariance theorem of Alpern and Asic, which the
    paper cites, are proved too, so the formalization is unconditional. Where the paper's
    arguments are informal (Theorems 10, 14, 16) they are completed; two statements and two
    formulas of the paper are corrected.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

