name: Adaptive bounds and exact refinement

on:
  push:
    branches: [research/interval-progress-2026-11-10]
    paths:
      - .github/workflows/adaptive-bound-discovery.yml
      - packages/interval_sparse_lower/**
      - packages/interval_mixture_cut/**
      - packages/interval_target_width/**
  # Expensive discovery is only enabled by an explicit manual dispatch.
  workflow_dispatch:
    inputs:
      run_joint_searches:
        description: Run the three discovery families for this workflow
        type: boolean
        default: true
      resume_run_id:
        description: Earlier adaptive run for matching search artifacts
        required: false
        default: ''
      run_sparse_lower:
        description: Repeat the legacy sparse-calendar Princess experiment
        type: boolean
        default: false
      refine_baseline:
        description: Repeat the already retained baseline fine-grid discovery
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  exact-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Check adaptive event geometry, exact cuts and resumption
        run: |
          python3 packages/interval_sparse_lower/test_sparse_lower.py
          python3 packages/interval_mixture_cut/test_search.py
          python3 packages/interval_mixture_cut/test_princess_retention.py
          python3 packages/interval_integer_flow/test_flow.py
          python3 packages/interval_target_width/refine.py --source packages/interval_clock_grid/normalized_princess_n6_fixture.json --n 12 --output /tmp/refinement-regression
          python3 packages/interval_clock_grid/normalized_native/verify_native_field.py /tmp/refinement-regression/field.json
          node packages/interval_clock_grid/normalized_record_pricing.cjs /tmp/refinement-regression/field.json --target-bound

  sparse-princess:
    needs: exact-regressions
    if: github.event_name == 'workflow_dispatch' && inputs.run_sparse_lower
    name: Adaptive Princess ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sparse-lower-prox
            option: --component-prox
            radius: .001
          - id: sparse-lower-direct
            option: ''
            radius: .00025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install numpy==2.3.5 scipy==1.17.0
      - if: inputs.resume_run_id != '' && inputs.resume_run_id != null
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: adaptive-${{ matrix.id }}
          path: results/${{ matrix.id }}
      - name: Search full fine-grid fields with closest legal extensions
        shell: bash
        run: |
          mkdir -p results/${{ matrix.id }}
          resume=()
          if test -f results/${{ matrix.id }}/state.json.gz; then resume=(--resume); fi
          python3 -u packages/interval_sparse_lower/search.py \
            --n 256 ${{ matrix.option }} --initial-routes 128 \
            --radius ${{ matrix.radius }} --keep 24 --seconds 2400 \
            --iterations 300 --lp-seconds 180 "${resume[@]}" \
            --output results/${{ matrix.id }} 2>&1 | tee results/${{ matrix.id }}/search.log
      - name: Record commit and environment
        if: always()
        run: |
          mkdir -p results/${{ matrix.id }}
          git rev-parse HEAD > results/${{ matrix.id }}/commit.txt
          python3 -m pip freeze > results/${{ matrix.id }}/dependencies.txt
          sha256sum packages/interval_sparse_lower/*.py packages/interval_sparse_upper/master.py packages/interval_clock_grid/normalized_native/price_normalized.cpp > results/${{ matrix.id }}/source-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-${{ matrix.id }}
          path: |
            results/${{ matrix.id }}/
            !results/${{ matrix.id }}/work/
          retention-days: 90
          if-no-files-found: error

  cut-mixtures:
    needs: exact-regressions
    if: github.event_name == 'workflow_dispatch' && inputs.run_joint_searches
    name: Joint physical Monster ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: n256-complete
            n: 256
            seed: 693147
            level: .8
            full_every: 1
          - id: n256-bold
            n: 256
            seed: 271828
            level: .4
            full_every: 2
          - id: n512-priced
            n: 512
            seed: 707106
            level: .8
            full_every: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install numpy==2.3.5 scipy==1.17.0
      - if: inputs.resume_run_id != '' && inputs.resume_run_id != null
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
          name: adaptive-mixture-${{ matrix.id }}
          path: results/mixture-${{ matrix.id }}
      - name: Optimize physical probabilities against exact active Qout cuts
        shell: bash
        run: |
          mkdir -p results/mixture-${{ matrix.id }}
          resume=()
          if test -f results/mixture-${{ matrix.id }}/checkpoint.json; then resume=(--resume results/mixture-${{ matrix.id }}/checkpoint.json); fi
          python3 -u packages/interval_mixture_cut/search.py \
            --initial-law packages/interval_discovery_certificates/monster_boundary_n256.physical.json.gz \
            --native-flow --loop-screen --n ${{ matrix.n }} \
            --iterations 120 --seconds 1200 --lp-seconds 120 \
            --boundary-points 48 --pricing-paths 128 --price-every 3 \
            --full-every ${{ matrix.full_every }} --alternative-cuts 16 \
            --level-fraction ${{ matrix.level }} --seed ${{ matrix.seed }} \
            "${resume[@]}" --output results/mixture-${{ matrix.id }} \
            2>&1 | tee results/mixture-${{ matrix.id }}/search.log
      - name: Independently reconstruct a new best on the full Qout grid
        shell: bash
        run: |
          if test -f results/mixture-${{ matrix.id }}/best.sparse.json; then
            node --max-old-space-size=6144 --stack-size=16384 packages/interval_mixture_cut/dense_replay.cjs results/mixture-${{ matrix.id }}/best.sparse.json results/mixture-${{ matrix.id }}/dense-check
            node --max-old-space-size=6144 --stack-size=16384 packages/interval_clock_grid/qout_primal_certificate.cjs results/mixture-${{ matrix.id }}/dense-check.physical.json
          fi
      - if: always()
        run: |
          mkdir -p results/mixture-${{ matrix.id }}
          git rev-parse HEAD > results/mixture-${{ matrix.id }}/commit.txt
          python3 -m pip freeze > results/mixture-${{ matrix.id }}/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-mixture-${{ matrix.id }}
          path: |
            results/mixture-${{ matrix.id }}/
            !results/mixture-${{ matrix.id }}/work/
          retention-days: 90
          if-no-files-found: error

  exact-refinement:
    needs: exact-regressions
    if: github.event_name == 'workflow_dispatch' && inputs.refine_baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      improves: ${{ steps.outcome.outputs.improves }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Completely price a finer bank for the retained best geometry
        run: python3 -u packages/interval_target_width/refine.py --n 512 --output results/refinement-512
      - id: outcome
        name: Gate an independent replay on an actual new native lower
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('results/refinement-512/manifest.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('improves='+str(d['native_candidate_improves_baseline']).lower()+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-refinement-512
          path: |
            results/refinement-512/
            !results/refinement-512/work/
          retention-days: 90
          if-no-files-found: error

  independent-fine-lower:
    needs: exact-refinement
    if: needs.exact-refinement.outputs.improves == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: adaptive-refinement-512
          path: results/refinement-512
      - name: Independently prove the complete fine-bank target with BigInt
        run: node --max-old-space-size=6144 packages/interval_clock_grid/normalized_record_pricing.cjs results/refinement-512/field.json --target-bound > results/refinement-512/independent.replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-refinement-512-independent
          path: results/refinement-512/
          retention-days: 90
          if-no-files-found: error
